services:
  pcmt-playercams:
    image: ${PCMT_PLAYERCAMS_IMAGE:-ghcr.io/ianmdesign/pcmt-playercams:latest}
    build: .
    container_name: pcmt-playercams
    restart: unless-stopped
    ports:
      - "5400:5400"
    environment:
      CONFIG_DIR: /app/config
      DATA_DIR: /data
      PORT: 5400
    volumes:
      # Config is read/write because persistent name overrides are stored here.
      - ./config:/app/config
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5400/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

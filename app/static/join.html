<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PCMT Playercam</title>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <main id="joinSetup" class="join-shell">
    <section class="card join-card stack">
      <div class="eyebrow">PCMT Playercams</div>
      <h1 style="font-size:36px">Join Playercam</h1>
      <p>Enter the full Riot ID you are using in this match, including the # and tagline.</p>
      <label>Riot ID
        <input id="riotId" autocomplete="off" placeholder="Player Name#NA1" />
      </label>
      <div class="choice-grid">
        <button id="shareVideo" class="choice">
          <strong>Share Video</strong>
          <span>Open VDO.Ninja's camera join flow.</span>
        </button>
        <button id="shareMedia" class="choice">
          <strong>Share Image / File</strong>
          <span>Open VDO.Ninja's media-file sharing flow.</span>
        </button>
      </div>
      <div id="joinError" class="error"></div>
    </section>
  </main>

  <main id="embedMode" class="hidden embed-mode">
    <div class="embed-toolbar">
      <span id="embedIdentity"></span>
      <button id="backButton" class="btn ghost" style="padding:5px 9px">Back</button>
    </div>
    <iframe id="vdoFrame" class="vdo-frame" allow="camera *; microphone *; display-capture *; autoplay *; fullscreen *"></iframe>
  </main>
  <script src="/static/join.js"></script>
</body>
</html>

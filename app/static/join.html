<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PCMT Playercam</title>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <div class="spectra-brand" aria-label="PCMT Playercams">
    <strong>PCMT</strong>
    <small>playercams</small>
  </div>

  <main id="joinSetup" class="join-shell">
    <section class="join-card">
      <h1>Enter or confirm your Valorant name</h1>
      <label>
        <input id="riotId" autocomplete="off" placeholder="Player Name#NA1" />
      </label>
      <p class="join-hint">Enter both your name and tag (e.g. Spectra#Overlay).<br />Make sure it is exactly the same as in-game.</p>
      <div class="choice-grid">
        <button id="shareVideo" class="choice">
          <strong>✓ Share Video</strong>
          <span>Open VDO.Ninja's camera join flow.</span>
        </button>
        <button id="shareMedia" class="choice media">
          <strong>✓ Share Image/File</strong>
          <span>Open VDO.Ninja's media-file sharing flow.</span>
        </button>
      </div>
      <div id="joinError" class="error"></div>
    </section>
  </main>

  <main id="embedMode" class="hidden embed-mode">
    <div class="embed-stage">
      <div class="embed-toolbar">
        <div id="embedIdentity" class="embed-player-identity"></div>
        <button id="backButton" class="btn ghost">Back</button>
      </div>
      <iframe id="vdoFrame" class="vdo-frame" allow="camera *; autoplay *; fullscreen *"></iframe>
    </div>
  </main>

  <script src="/static/join.js"></script>
</body>
</html>
